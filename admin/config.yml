    name: title
    widget: string
  - label: Date
    name: date
    widget: datetime
  - *id001
  - label: Description
    name: description
    widget: markdown
    required: false
    hint: Teaser shown on the content page — supports paragraphs and formatting
  - label: Cover Image
    name: cover
    widget: image
    required: false
    hint: Optional cover art. You can also paste an image directly (Ctrl+V) on this
      page.
  - label: Body
    name: body
    widget: markdown
  - label: Audio
    name: audio
    widget: file
    required: false
    hint: 'Upload MP3 narration for this story. Enables the audio player with auto
      paragraph sync Max direct upload: ~25 MB.'
  - label: Access Tier
    name: tier
    widget: select
    options:
    - label: Free — visible to everyone
      value: free
    - label: Devoted — $5 members
      value: devoted
    - label: Bound — $12 members
      value: bound
    default: devoted
  sortable_fields: *id002
- name: wips
  label: WIPs & Sketches
  folder: _data/wips
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Date
    name: date
    widget: datetime
  - *id001
  - label: Image
    name: image
    widget: image
  - label: Note
