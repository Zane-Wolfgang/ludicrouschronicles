backend:
  name: github
  repo: Zane-Wolfgang/ludicrouschronicles
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
collections:
- name: announcements
  label: Announcements
  folder: _data/announcements
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Date
    name: date
    widget: datetime
  - label: Tag
    name: tag
    widget: string
    default: Update
    hint: e.g. Launch, Update, Chapter, Art
  - label: Body
    name: body
    widget: markdown
  sortable_fields: &id002
  - title
  - date
  - commit_date
  - commit_author
- name: chapters
  label: Chapters
  folder: _data/chapters
  create: true
  slug: chapter-{{fields.number}}
  media_folder: /images
  public_folder: /images
  fields:
  - label: Title
    name: title
    widget: string
  - label: Chapter Number
    name: number
    widget: number
    value_type: int
  - label: Date
    name: date
    widget: datetime
  - &id001
    label: Premiere Date & Time
    name: premiere_at
    widget: datetime
    required: false
    hint: Leave blank to post immediately. Set a future date+time to schedule — the
      post will appear automatically at that moment without you needing to log in.
  - label: Chapter Art
    name: art
    widget: image
    required: false
  - label: Body
    name: body
    widget: markdown
  - label: Audio
    name: audio
    widget: file
    required: false
    hint: 'Upload MP3 narration for this chapter. Enables the audio player with auto
      paragraph sync Max direct upload: ~25 MB.'
  - label: Include in Voice tab
    name: is_voice
    widget: boolean
    default: false
    required: false
    hint: Check this if the chapter has a voice/narration recording. It will appear
      in both Story and Voice tabs.
  - label: Access Tier
    name: tier
    widget: select
    options:
    - label: Free — visible to everyone
      value: free
    - label: Devoted — $5 members
      value: devoted
    - label: Bound — $12 members
      value: bound
    default: free
  sortable_fields:
  - date
  - title
  - commit_date
  - commit_author
- name: gallery
  label: Gallery
  folder: _data/gallery
  create: true
  media_folder: /images
  public_folder: /images
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Date
    name: date
    widget: datetime
  - *id001
  - label: Main Image
    name: image
    widget: image
  - label: Page 2
    name: image2
    widget: image
    required: false
    hint: Second image in slideshow
  - label: Page 3
    name: image3
    widget: image
    required: false
    hint: Third image in slideshow
  - label: Page 4
    name: image4
    widget: image
    required: false
    hint: Fourth image in slideshow
  - label: Artist's Note
    name: notes
    widget: markdown
    required: false
    hint: Shown below the image in the lightbox — supports paragraphs and formatting.
  - label: Type
    name: type
    widget: select
    options:
    - label: Chapter Art
      value: Chapter Art
    - label: Character Art
      value: Character Art
    - label: Illustration
      value: Illustration
    - label: Sketch / WIP
      value: Sketch / WIP
  - label: Access Tier
    name: tier
    widget: select
    options:
    - label: Free — visible to everyone
      value: free
    - label: Devoted — $5 members
      value: devoted
    - label: Bound — $12 members
      value: bound
    default: free
  sortable_fields: *id002
- name: videos
  label: Videos
  folder: _data/videos
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
  - label: Title
    name: title
    widget: string
  - label: Date
    name: date
    widget: datetime
  - label: Video File
    name: video
    widget: file
    required: false
    hint: 'Direct upload limit: ~25 MB (GitHub API cap). For larger videos, leave this
      empty and paste a direct link in the Video URL field below.'
  - label: Video URL
    name: video_url
    widget: string
    required: false
    hint: 'For large videos: paste a DIRECT video file link (Backblaze, Dropbox direct
      download, etc. ending in .mp4/.webm). If both this and a Video File are set, this
      URL is used. (YouTube/Vimeo page links will not play in the built-in player.)'
  - label: Thumbnail
    name: thumbnail
    widget: image
    required: false
  - label: Description / Credits
    name: description
    widget: markdown
    required: false
    hint: Notes, credits, music attribution, collaborators, etc.
  - label: Type
    name: type
    widget: select
    options:
    - label: Animation
      value: Animation
    - label: Behind the Scenes
      value: Behind the Scenes
    - label: Timelapse
      value: Timelapse
    - label: Blooper
      value: Blooper
  - label: Include in Voice tab
    name: is_voice
    widget: boolean
    default: false
    required: false
    hint: Check this if the video has voice acting / narration. It will appear in
      both Video and Voice tabs.
  - label: Access Tier
    name: tier
    widget: select
    options:
    - label: Free — visible to everyone
      value: free
    - label: Devoted — $5 members
      value: devoted
    - label: Bound — $12 members
      value: bound
    default: devoted
  sortable_fields: *id002
- name: short_stories
  label: Short Stories
  folder: _data/short-stories
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
