- name: emojis
  label: Emojis
  folder: _data/emojis
  create: true
  media_folder: /images/emojis
  public_folder: /images/emojis
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
  - label: Name
    name: title
    widget: string
    hint: Display name, e.g. Angry Vasily
  - label: Image
    name: image
    widget: image
    hint: Upload to images/emojis/
  - label: Display Size (px)
    name: size
    widget: number
    default: 32
    hint: How big it appears inline in reactions — 24 to 48 recommended
  - label: Hover Preview Size (px)
    name: preview_size
    widget: number
    default: 96
    min: 48
    max: 256
    hint: How big it appears in the hover tooltip — go larger for detailed stickers
  - label: Active
    name: active
    widget: boolean
    default: true
  sortable_fields: *id002
- name: music
  label: Music
  folder: _data/music
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}'
  fields:
  - label: Title
    name: title
    widget: string
    hint: Track name shown in the player
  - label: Artist
    name: artist
    widget: string
    required: false
  - label: Audio File
    name: audio
    widget: file
    hint: 'Upload MP3 Max direct upload: ~25 MB.'
  - label: Order
    name: order
    widget: number
    default: 99
    hint: Play order (1 = first)
  - label: Active
    name: active
    widget: boolean
    default: true
  sortable_fields: *id002
- name: settings
  label: Site Settings
  files:
  - name: general
    label: General Settings
    file: _data/site-settings.yml
    fields:
    - label: 1920s Vintage Mode
      name: vintage_mode
      widget: boolean
      default: false
      hint: Applies sepia filters, vintage fonts and Art Deco patterns across the
        site
    - label: Radio Filter Strength
      name: radio_strength
      widget: number
      default: 50
      value_type: int
      min: 0
      max: 100
      hint: How strong the radio effect is on the music player (0 = subtle warmth,
        100 = heavy crackle). Visitors can toggle it on/off.
