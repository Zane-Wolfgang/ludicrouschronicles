[build]
  command = "npm install && node cms-build.js"
  publish = "."
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "18"

# Static art — never changes, cache aggressively
[[headers]]
  for = "/images/art-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CMS uploads — new files added regularly, short cache so they appear without hard refresh
[[headers]]
  for = "/images/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Edge functions: per-item Open Graph link previews ──
[[edge_functions]]
  path = "/gallery.html"
  function = "og-preview"

[[edge_functions]]
  path = "/videos.html"
  function = "og-preview"

[[edge_functions]]
  path = "/content.html"
  function = "og-preview"

[[edge_functions]]
  path = "/chapter.html"
  function = "og-preview"

# ── Image CDN: enables downscaled preview images ──
[images]
  remote_images = ["https://ludicrous-chronicles.netlify.app/.*"]
